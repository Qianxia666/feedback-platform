services:
  feedback-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: feedback-platform:latest
    container_name: feedback-platform
    init: true
    ports:
      - "5000:5000"
    volumes:
      - feedback-data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请先设置 ADMIN_PASSWORD 环境变量}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-1048576}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_HOST=0.0.0.0
      - DB_DIR=/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 100
    networks:
      - feedback-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedback-network:
    driver: bridge

volumes:
  feedback-data:
    name: feedback-data 
