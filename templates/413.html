{% extends "base.html" %}

{% block content %}
<div class="err">
    <p class="err-code">ERROR 413</p>
    <h1 class="err-title">文件太大了</h1>
    <p class="err-text">上传的内容超过了大小限制。压缩一下再试，或者只贴关键部分。</p>
    <div class="err-actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">回到反馈台账</a>
        <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
    </div>
</div>
{% endblock %}
