{% extends "base.html" %}

{% block content %}
<div class="err">
    <p class="err-code">ERROR 400</p>
    <h1 class="err-title">请求有误</h1>
    <p class="err-text">这个请求缺少必要的信息，或者格式不对。返回上一页重试一次。</p>
    <div class="err-actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">回到反馈台账</a>
        <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
    </div>
</div>
{% endblock %}
