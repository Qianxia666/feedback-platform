{% extends "base.html" %}

{% block content %}
<div class="err">
    <p class="err-code">ERROR 404</p>
    <h1 class="err-title">页面不存在</h1>
    <p class="err-text">地址可能拼错了，或者这条内容已经被删除。台账里还有别的反馈可以看。</p>
    <div class="err-actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">回到反馈台账</a>
        <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
    </div>
</div>
{% endblock %}
