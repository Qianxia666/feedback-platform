{% extends "base.html" %}

{% block content %}
<div class="err">
    <p class="err-code">ERROR 500</p>
    <h1 class="err-title">服务器出了点问题</h1>
    <p class="err-text">这不是你的操作造成的。刷新一次，如果仍然这样，请稍后再来。</p>
    <div class="err-actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">回到反馈台账</a>
        <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
    </div>
</div>
{% endblock %}
